size = "An over figure holds if it is no more than 3 times smaller than its brightness suggests."

# ---------------------------------------------------------------------------
# 9. Reference draw (tools/value_examples.py and tests only)
# ---------------------------------------------------------------------------
# The pipeline's draws come from longshot/draws.py. This stand-in follows steps 1
# to 5 of priors.toml [joint], with the constants below copied from priors.toml
# on 2026-11-25, so the worked examples can be reproduced without the pipeline.
# If priors.toml changes, the pipeline's figures move and these do not.

[reference_draw]
copied_from = "method/v0_1/priors.toml, 2026-11-25"
steps = [
  "1. H: normal(H, h_sigma)",
  "2. reflectivity: from the size if the size is measured; else from by_class_S if the class is measured S and the draw is not mislabelled (step 4); else from pv. Inverse transform, log10 linear in p, clamped to the table ends",
  "3. diameter: the measured size (lognormal, the stated spread) or coefficient_m x 10^(-H/5) / sqrt(reflectivity)",
  "4. class: the measured class, except in label_error of the draws, which are mislabelled: those take a class from the other side of S/Q against the rest. A mislabelled draw, and a draw with no measured class, is drawn with weight joint_weight[class] x link[class][bin of reflectivity]",
  "5. density: flat within density_kg_m3 for the class; for X, by reflectivity band",
]
coefficient_m = 1329000.0
h_sigma = 0.36
label_error_spectrum = 0.125           # priors.toml [class.label_error].spectrum; example 2 carries it in its inputs
label_error_note = "The pipeline draws a mislabelled draw's reflectivity from the table of the class it takes; this stand-in has only the S table and uses the all-class one. The two agree on the chance of nothing to within a count of 100"
p = [0.025, 0.050, 0.100, 0.150, 0.200, 0.250, 0.300, 0.350, 0.400, 0.450, 0.500, 0.550, 0.600, 0.650, 0.700, 0.750, 0.800, 0.850, 0.900, 0.950, 0.975]
