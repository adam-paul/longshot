# The difficulty ladder: constants for longshot/ladder.py. Method 0.1.
#
# A proposal until Adam freezes it. docs/method-value.md explains each choice.
# Evidence: docs/research/capability.md as corrected by
# docs/research/verify-capability.md (check date 2026-11-21). The seven
# corrections and the refuted claim are applied; none of the original wording
# they replaced is carried. Arithmetic: tools/value_inputs.py sections 5 and 6.
#
# Read tags: P = primary source read, S = secondary, L = read from a saved copy,
# R = recalled.

[meta]
method = "0.1"
status = "proposal"
as_of = "2026-11-21"                   # the day the record below was last read at source
as_of_words = "21 November 2026"
order = ["found_again", "reached", "workable", "anything_in_it", "brought_back"]
statuses = ["measured", "prior", "unknown"]
status_rule = "measured: every input of the rung is measured. prior: any input is a prior or was not checked. unknown: no input at all"

[format]
period = "from 2 hours, hours to three figures ('7.63 hours'); from 2 minutes, minutes ('27.9 minutes'); below that, seconds ('92.5 seconds')"
ratio = "one figure; two when the first digit is 1 or 2 ('15 to 40', '5,000 to 14,000')"
count = "a whole number of 100"

# ---------------------------------------------------------------------------
# Thresholds. The size and spin lines for the last rung rest on three sampled
# asteroids. They are judgement, not physical limits, and the page says so.
# ---------------------------------------------------------------------------

[thresholds]
sampled_min_m = 300.0
sampled_min_m_basis = "the smallest asteroid sampled is Itokawa, 535 x 294 m, mean 330 m"
sampled_min_period_h = 4.0
sampled_min_period_basis = "the fastest asteroid sampled is Bennu, once in 4.296 hours"
touched_min_m = 160.0
touched_min_basis = "the smallest body any spacecraft has touched is Dimorphos, 160 m (DART, an impact)"
small_m = 100.0
small_basis = "Tianwen-2 is the one spacecraft found to have reached an asteroid under 100 m"
very_fast_period_min = 10.0
very_fast_basis = "outward pull goes as one over the period squared; a two-minute rotator pulls about 200 times harder than Kamoʻoalewa, so Tianwen-2 is not cited for it (verify-capability.md section 4, objection 6)"
judgement = "The size and spin lines come from three sampled asteroids. They are not physical limits."

[classes.size]
# d_lo and d_hi are summary.size_m q05 and q95: the 5th and 95th of the draws, which follow a measured size and its stated error.
sampled = "d_lo >= sampled_min_m"
may_be_sampled = "d_lo < sampled_min_m <= d_hi"
below_sampled = "touched_min_m <= d_hi < sampled_min_m"
untouched = "d_hi < touched_min_m"

[classes.spin]
# From the spin row. "Measured period" here and below means a period that decides a gate under
# missions.toml [rules.period]: graded U 2 or 3, or published with no grade on file.
slow = "a measured period of sampled_min_period_h or longer"
faster = "a measured period from very_fast_period_min up to sampled_min_period_h"
very_fast = "a measured period under very_fast_period_min"
not_measured = "no measured period: the spin row is a prior, a limit or not checked, or its only period is graded under 2"

[spin_limit]
# The period at which the outward pull at the equator of a sphere equals its gravity:
# sqrt(3 pi / (G x density)). Faster than this, loose material stays only by cohesion.
formula = "ratio of outward pull to gravity at the equator = (limit_h / period_h)^2"
light_rock_kg_m3 = 1200.0
light_rock_limit_h = 3.01
dense_rock_kg_m3 = 3300.0
dense_rock_limit_h = 1.82
basis = "tools/value_inputs.py section 5. Checked: 2.33 h at 2,000 kg/m3 (verify-capability.md section 2)"
note = "The 2026 paper on 2022 OB5 gives 'nearly two orders of magnitude' for that object. Its own inputs give about 5,500; this method gives 5,000 to 14,000. The paper's figure is not quoted (verify-capability.md, side finding on row 32)"
published_bar_h = 1.0
published_bar_source = "a period over 1 hour 'considered viable for surface operations': Thirouin et al. 2016, as quoted by Alarcon et al. 2026, arXiv:2605.04784 (P). The criterion is Thirouin's, not the 2026 paper's"
screening_line_h = 2.2
screening_line_source = "docs/plan.md 1.2: 'a screening line for surface work, not a physical limit'"

