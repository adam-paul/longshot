# ---------------------------------------------------------------------------
# Slots a template may use, and where ladder.py finds each.
# ---------------------------------------------------------------------------

[slots]
occ = "tracking row: JPL orbit condition code, 0 (best) to 9"
gone = "record.gone.text: ledger.toml [[gone]]"
dv = "reach row: delta-v of the cheapest round trip, km/s"
conflict = "spin row: its conflict sentence, as the ledger wrote it"
r_lo = "(spin_limit.dense_rock_limit_h / period_h)^2"
r_hi = "(spin_limit.light_rock_limit_h / period_h)^2"
n_fast = "100 x summary.p_fast_2_2h"
sources = "spin row: the sources not checked, by name"
measured_in_sample = "the sample_return fact whose target is this asteroid"

# ---------------------------------------------------------------------------
# The five rungs. A rung's text is its sentences joined by one space.
# A rung says what the rows above it on the entry do not (DESIGN.md section 5): the consequence, not the value.
# The orbit code, the window, the delta-v and trip, the size and mass ranges, the period and the price tag are
# each printed once, in their own row or block.
# ---------------------------------------------------------------------------

[rung.found_again]
question = "Can it be found again?"
inputs = "the gate with id 'findable' in missions.toml (the same in both presets; the 'findable' column of the field file), the orbit code and the days of tracking"

[[rung.found_again.state]]
id = "findable"
status = "measured"
when = "the orbit gate passes"
gate = "pass"
text = "Orbit code {occ}: 5 or better, the line used here."

[[rung.found_again.state]]
id = "not_findable"
status = "measured"
when = "the orbit gate fails"
gate = "fail"
text = "Orbit code {occ}: worse than 5, the line used here."

[[rung.found_again.state]]
id = "no_orbit_code"
status = "unknown"
when = "no orbit code on file, or the orbit gate is untested"
gate = "untested"
text = "No orbit code on file."

[[rung.found_again.state]]
id = "gone"
status = "measured"
when = "ledger.toml lists the body as gone"
gate = "gone"
text = "{gone}"

# The orbit code and JPL's own pointing test are two tests and do not pick the same objects: JPL flags some
# windows of code 4 and 5 objects as survey-recovery-only, and lists pointable windows for some of code 6
# (docs/research/verify-obs-window.md section 1 and the short list after it). So the state above speaks only of
# the code. The window itself is in the tracking row; a sentence follows only when JPL's test says the code
# is not enough: the window is survey-recovery-only, or there is none (observe.toml [window]).
[[rung.found_again.suffix]]
id = "window_pointable"
when = "a window is listed and it is pointable (observe.toml [window].pointable)"
window = "pointable"
text = ""

[[rung.found_again.suffix]]
id = "window_survey_only"
when = "a window is listed and it is survey-recovery-only (observe.toml [window].survey_only)"
window = "survey_only"
text = "JPL finds its position too uncertain to point at."

[[rung.found_again.suffix]]
id = "window_none"
when = "no window is listed (observe.toml [window].none)"
window = "none"
text = "JPL lists no window through 2045."

[rung.reached]
question = "Can it be reached?"
inputs = "the reach row"
left_out = "the launch date of that trip is not in JPL's bulk list, which gives delta-v and duration only; the rung says so. A per-object call would give it: a data gap for the next pull"

[[rung.reached.state]]
id = "round_trip"
status = "measured"
when = "a round trip is on file"
text = "{dv} km/s round trip. Launch date not on file."

[[rung.reached.state]]
id = "no_round_trip"
status = "unknown"
when = "no round trip on file"
text = "No round trip on file."

[[rung.reached.suffix]]
id = "small_bodies_reached"
when = "d_hi < thresholds.small_m, and the asteroid is not Kamoʻoalewa"
text = "As of 21 November 2026 we found one spacecraft that has reached an asteroid under 100 m: Tianwen-2, at Kamoʻoalewa (18 ± 2 m, JWST), in July 2026."
facts = ["tianwen_2"]

[rung.workable]
question = "Is it big enough and slow enough to work on?"
inputs = "the size row and the spin row"
text_rule = "one sentence on what the spin means for loose material; the size, the mass and the period are in their rows and are not repeated. When the row's sources disagree, 'Sources disagree on the period.' follows"
status_rule = "measured if the size row is measured and a period decides; unknown if there is no size, no period and no share; otherwise prior"

[[rung.workable.state]]
id = "slow"
status = "measured"
when = "a measured period of spin_limit.light_rock_limit_h or longer"
row = "measured"
period_h = [3.01, 1e9]
text = "Slower than the 3.0 hours at which even light rock (1,200 kg/m³) would lose loose material from its equator."

[[rung.workable.state]]
id = "near_limit"
status = "measured"
when = "a measured period from spin_limit.dense_rock_limit_h up to spin_limit.light_rock_limit_h"
row = "measured"
period_h = [1.82, 3.01]
text = "Inside the 1.8 to 3.0 hours at which the outward pull at the equator equals gravity for rock of 3,300 to 1,200 kg/m³."

[[rung.workable.state]]
id = "fast"
status = "measured"
when = "a measured period under spin_limit.dense_rock_limit_h"
row = "measured"
period_h = [0.0, 1.82]
text = "At its equator the outward pull is {r_lo} to {r_hi} times its gravity (rock of 3,300 to 1,200 kg/m³)."

[[rung.workable.state]]
id = "spin_not_measured"
status = "prior"
when = "the spin row is a prior"
row = "prior"
text = "Of 100 like it, {n_fast} turn faster than once in 2.2 hours."

[[rung.workable.state]]
id = "spin_limit_only"
status = "prior"
when = "the spin row is a limit"
row = "limit"
text = "Spin known only as a limit. Of 100 like it, {n_fast} turn faster than once in 2.2 hours."

[[rung.workable.state]]
id = "spin_not_checked"
status = "prior"
when = "the spin row is not checked"
row = "unchecked"
text = "Spin not checked ({sources}). Of 100 like it, {n_fast} turn faster than once in 2.2 hours."

[[rung.workable.state]]
id = "period_unreliable"
status = "prior"
when = "the only period on file is graded under 2 (missions.toml [rules.period])"
row = "measured"
decides = false
text = "The period on file is graded unreliable. Of 100 like it, {n_fast} turn faster than once in 2.2 hours."

[[rung.workable.state]]
id = "spin_conflict"
status = "prior"
when = "periods in use fall on both sides of a spin gate (missions.toml [rules.conflict])"
row = "measured"
decides = false
text = "Sources disagree: {conflict} Of 100 like it, {n_fast} turn faster than once in 2.2 hours."

[[rung.workable.suffix]]
id = "sources_disagree"
when = "a period decides and the spin row carries a conflict"
text = "Sources disagree on the period."

[rung.anything_in_it]
question = "Is there anything in it?"
inputs = "the surface row, the size row's state, and the returned sample if there is one"
text_rule = "what the answer rests on. The chance of nothing and the ranges are in the price tag below the ladder, once"

[[rung.anything_in_it.state]]
id = "sampled"
status = "measured"
when = "the asteroid is the target of a sample_return fact"
text = "{measured_in_sample}"
text_no_analysis = "Sampled."
slots = "from the fact: measured_in_sample"
facts = ["hayabusa", "hayabusa2", "osiris_rex"]

[[rung.anything_in_it.state]]
id = "from_class"
status = "prior"
when = "the surface row is measured or a limit"
text = "Estimated from its class or reflectivity, and its brightness."

[[rung.anything_in_it.state]]
id = "from_size"
status = "prior"
when = "the size row is measured or a limit and the surface row is a prior"
text = "Estimated from its size. Nothing on file says what it is made of."

[[rung.anything_in_it.state]]
id = "from_size_not_checked"
status = "prior"
when = "the size row is measured or a limit and the surface row is not checked"
text = "Estimated from its size. Surface not checked ({sources})."

[[rung.anything_in_it.state]]
id = "from_brightness"
status = "prior"
when = "neither row is measured and the surface row is a prior"
text = "Estimated from brightness alone."

[[rung.anything_in_it.state]]
id = "from_brightness_not_checked"
status = "prior"
when = "neither row is measured and the surface row is not checked"
text = "Estimated from brightness alone. Surface not checked ({sources})."

[[rung.anything_in_it.state]]
id = "gone"
status = "measured"
when = "ledger.toml lists the body as gone"
text = "It no longer exists."

[rung.brought_back]
question = "Could today's technology bring any of it back?"
inputs = "summary.size_m (q05, q95: the draws, which follow a measured size and its stated error), the spin row, and the record above"
text_rule = "one grams sentence: a special state if the asteroid is a fact's target, else the one state whose size and spin lists hold its classes. Then any suffix that applies, more_than_grams last"
status_rule = "measured if the size row is measured and the spin class is not not_measured; otherwise prior"

[rung.brought_back.words]
done = "done three times, by space agencies"
not_yet_attempted = "not yet attempted"
proposed = "proposed"

[[rung.brought_back.state]]
id = "sampled_here"
word = "done"
when = "the asteroid is the target of a sample_return fact"
special = "sample_return_target"
text = "Grams: done. {returned} returned from this asteroid ({mission}, {return_year}) for {cost} in the money of the day."
slots = "from the fact: returned, mission, return_year, cost"
facts = ["hayabusa", "hayabusa2", "osiris_rex"]

[[rung.brought_back.state]]
id = "in_position_here"
word = "not_yet_attempted"
when = "the asteroid is the target of an in_position fact"
special = "in_position_target"
text = "Grams: not yet attempted. Tianwen-2 reached this asteroid in July 2026 and had reported no sampling attempt by 21 November 2026."
facts = ["tianwen_2"]

[[rung.brought_back.state]]
id = "sampled_kind"
word = "done"
when = "size sampled, spin slow"
size = ["sampled"]
spin = ["slow"]
text = "Grams: done three times, by space agencies, on asteroids of this size and spin, at ¥20 billion to $1.2 billion a mission in the money of the day."
facts = ["hayabusa", "hayabusa2", "osiris_rex"]

[[rung.brought_back.state]]
id = "sampled_size_spin_unknown"
word = "done"
when = "size sampled, spin not measured"
size = ["sampled"]
spin = ["not_measured"]
text = "Grams: done three times, by space agencies, on asteroids of this size that turn once in 4.3 to 12.1 hours. Its own spin is not measured."
# Used in place of the last sentence when a source for the spin row was not checked: "not checked" is never worded as "not measured".
not_measured_sentence = "Its own spin is not measured."
not_checked_sentence = "Its own spin is not checked ({sources})."
facts = ["hayabusa", "hayabusa2", "osiris_rex"]

[[rung.brought_back.state]]
id = "sampled_size_faster"
word = "not_yet_attempted"
when = "size sampled, spin faster than any sampled"
size = ["sampled"]
spin = ["faster", "very_fast"]
text = "Grams: not yet attempted on an asteroid that turns this fast. The three sampled turn once in 4.3 to 12.1 hours."
facts = ["hayabusa", "hayabusa2", "osiris_rex"]

[[rung.brought_back.state]]
id = "may_be_sampled_size"
word = "done"
when = "the size range straddles the smallest sampled"
size = ["may_be_sampled"]
spin = ["slow", "faster", "very_fast", "not_measured"]
text = "Grams: done three times, by space agencies, on asteroids 330 to 900 m across, and not yet attempted on a smaller one. Its size range spans that line."
facts = ["hayabusa", "hayabusa2", "osiris_rex"]

[[rung.brought_back.state]]
id = "below_sampled_size"
word = "not_yet_attempted"
when = "smaller than any sampled, not smaller than the smallest touched"
size = ["below_sampled"]
spin = ["slow", "faster", "very_fast", "not_measured"]
text = "Grams: not yet attempted at this size. The three asteroids sampled are 330 to 900 m across; the smallest any spacecraft has touched is 160 m, struck at about 6 km/s in 2022 (DART)."
facts = ["hayabusa", "hayabusa2", "osiris_rex", "dart"]

[[rung.brought_back.state]]
id = "very_fast"
word = "not_yet_attempted"
when = "smaller than any touched, turning in under ten minutes"
size = ["untouched"]
spin = ["very_fast"]
text = "Grams: not yet attempted. As of 21 November 2026 we found no spacecraft that has approached an asteroid turning this fast; the fastest reached turns once in 27.9 minutes (Kamoʻoalewa, JWST)."
facts = ["tianwen_2"]

[[rung.brought_back.state]]
id = "untouched_size"
word = "not_yet_attempted"
when = "smaller than any touched, otherwise"
size = ["untouched"]
spin = ["slow", "faster", "not_measured"]
text = "Grams: not yet attempted. As of 21 November 2026 we found no spacecraft that has touched an asteroid this small."
facts = ["tianwen_2", "dart"]

[[rung.brought_back.state]]
id = "gone"
word = "done"
when = "ledger.toml lists the body as gone"
special = "gone"
text = "It no longer exists."

[[rung.brought_back.suffix]]
id = "spin_decides"
when = "the state is one of these and the spin class is not_measured"
after = ["untouched_size", "below_sampled_size", "may_be_sampled_size"]
spin = ["not_measured"]
text = "Its spin is not measured, and the answer depends on it."
# When the sources disagree across a spin gate (missions.toml [rules.conflict]).
text_conflict = "Sources disagree on its spin, and the answer depends on it."
# When a source for the spin row was not checked.
text_not_checked = "Its spin is not checked ({sources}), and the answer depends on it."

[[rung.brought_back.suffix]]
id = "more_than_grams"
word = "proposed"
when = "always, last"
text = "Kilograms or tonnes: proposed since the 1990s, first costed in 2012 at $2.6 billion (2012 dollars) for about 500 tonnes to lunar orbit, never built."
facts = ["sonter_1998", "keck_2012", "arm"]

# ---------------------------------------------------------------------------
# For method.html: the record in full. Sentences in order.
# ---------------------------------------------------------------------------

[[sitewide]]
text = "As of 21 November 2026, three spacecraft have brought asteroid material to Earth: 121.6 grams from Bennu, 5.4 grams from Ryugu and under a milligram from Itokawa."
facts = ["osiris_rex", "hayabusa2", "hayabusa"]

[[sitewide]]
text = "The missions cost about $1.0 to 1.2 billion, ¥29 billion and ¥20 billion in the money of their day, and each took six to seven years from launch."
facts = ["osiris_rex", "hayabusa2", "hayabusa"]

[[sitewide]]
text = "For the largest sample that is about ten million dollars a gram, counting the whole mission, which was built for science and not for mass."
facts = ["osiris_rex"]

[[sitewide]]
text = "Had that sample been pure platinum, it would have sold for under $5,000 at any yearly average price of 2021 to 2025."
facts = ["osiris_rex"]
basis = "121.6 g at $961 to $1,200 a troy ounce: $3,756 to $4,691. tools/value_inputs.py section 6"

[[sitewide]]
text = "All three asteroids are 300 to 900 m across and turn once in 4 to 12 hours."
facts = ["osiris_rex", "hayabusa2", "hayabusa"]

[[sitewide]]
text = "We found no spacecraft that has touched an asteroid under 160 m. One reached Kamoʻoalewa (18 ± 2 m, JWST) in July 2026 and had reported no sampling attempt."
facts = ["dart", "tianwen_2"]

[[sitewide]]
text = "We found no company that has reached an asteroid."
facts = ["companies"]

[[sitewide]]
text = "Returning tonnes has been proposed since the 1990s. Two designs were costed: a 2012 study at $2.6 billion (2012 dollars) for about 500 tonnes to lunar orbit, and NASA's Asteroid Redirect Mission, capped in 2016 at $1.4 billion without launch or operations, for a boulder of up to 13.5 tonnes. The first was never started and the second was cancelled in 2017."
facts = ["sonter_1998", "keck_2012", "arm"]

[[sitewide]]
text = "One tonne is 8,000 times the largest sample. The two costed designs are 110,000 and 4 million times it."
facts = ["gap"]
