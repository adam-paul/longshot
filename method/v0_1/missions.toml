# longshot method 0.1: elimination by mission type.
#
# A PROPOSAL until Adam freezes it. After that no threshold here changes; a change is a new method version.
# Presets are fixed, not sliders (docs/plan.md section 5.1). docs/method.md explains each gate.
#
# Every gate carries `kind` and `source`:
#   measured  = measured from data on disk by a script in tools/
#   quoted    = quoted from a file under docs/research, which names the published source
#   judgement = a choice made here between quoted values; `range` and `alternatives` give what it was chosen from
#
# The named-target check at the end of each mission is written by hand from the output of
# tools/method_missions.py (method/v0_1/derivation/missions.txt), which reads the pipeline's own records, so the
# check and the entry pages cannot drift apart; `uv run python -I tools/method_missions.py --check` fails if a
# recorded status or probability no longer matches. tools/method_check.py recomputes the untested probabilities
# by plain random draws, with no code shared with the pipeline or with that script.

schema = 1
method = "0.1"
status = "proposal"
order = ["surface", "capture"]

[rules]
# How gates become a status. The same for every mission type.
gate = [
  "pass or fail when a measurement decides it: the measured value clears the threshold by 2 of its stated one-sigma errors, or, with no stated error, by a factor of 2",
  "untested otherwise, with p = the share of the object's 2,000 joint draws of size, class, reflectivity, density and spin that pass the gate",
  "an untested p is never 0 or 1: with n draws it is held between 1/n and 1 - 1/n, and prints as 'under 1%' or 'over 99%'",
]
mission = [
  "fail if any gate fails",
  "pass if every gate passes",
  "untested otherwise, with p = the share of joint draws that pass every gate; a gate decided by measurement is fixed in every draw",
]
kind = "quoted"
source = "DESIGN.md section 3 (known pass, known fail, untested with a probability) and docs/plan.md Appendix C, WP2"

[rules.decide]
# How far a measured value must stand from a threshold before it decides a gate.
sigma = 2.0
no_range_factor = 2.0
stated_errors = "one sigma: JPL's diameter_sigma, Spitzer's d1sigl and d1sigu, the error.min and error.max of a literature card, the +/- of Pravec's table"
draw = "a measured value is drawn from its stated error, each side its own width, with no clamp; a size with no stated error is drawn log-normally with two sigma equal to a factor of 2"
period_without_error = "a period with no stated error decides as it stands ([rules.period])"
kind = "judgement"
source = "Review of 2026-11-25: with the one-sigma range read as the whole range, 17 of 381 size gates were decided with the threshold inside two sigma, and 8 more by a size with no stated error within a factor of 2 of it; 2 of the 3 capture passes rested on sizes with no error. Two sigma leaves about 1 chance in 40 on the far side. The factor of 2 for a size with no error is the reviewer's line; 1998 KY26 and Kamoʻoalewa came out 2 to 3 times smaller than first given (AGENTS.md, traps)"
alternatives = [
  { value = 1.0, what = "the stated range taken as the whole range: the rule before the review" },
  { value = 2.0, what = "about 97.7% on one side" },
  { value = 3.0, what = "the detection bar of ledger.toml [push]" },
]

[rules.period]
# Which rotation period decides a spin gate.
min_grade = 2
decides = "a period graded U 2 or 3, or a published period with no grade on file"
does_not_decide = "a period whose only grade is under 2: the gate is untested and its text gives the period and the grade"
kind = "quoted"
source = "docs/research/verify-coverage.md section 2.1 (reliable = U of 2 or more); AGENTS.md, traps: JPL's 10 h for 2011 AA37 is graded unreliable in the lightcurve database"
decides_kind = "judgement"
decides_source = "Periods on the literature cards carry no grade, and 27 list members have a period only there (docs/research/verify-coverage.md section 2.1). Leaving them out would call measured fast rotators untested"

[rules.size]
# A measured size that would make the surface impossibly dark does not decide a gate; the entry shows it as a conflict.
min_implied_reflectivity = 0.005
# Nor does one that would make it brighter than a perfect diffuser. ledger.toml [reflectivity] holds the same line
# for a reflectivity a source states.
max_implied_reflectivity = 1.0
max_source = "ledger.toml [reflectivity].max. Six list members carried a used Spitzer size with a fitted reflectivity of 1.07 to 1.40, each a fit at signal-to-noise 0.9 to 3.3 (review of 2026-11-25)"
implied = "pv = (1.329e6 * 10^(-H/5) / D[m])^2"
h_allowance = "H carries its own error. A size is turned away only when the implied reflectivity is outside the two lines for every H within 2 of its one-sigma errors: Kamoʻoalewa's 18 m (JWST) implies 1.01 at JPL's H 24.33 and 0.52 at H 25.05"
kind = "judgement"
source = "docs/research/verify-coverage.md section 1.1: 2010 NU71 (H 22.7) carries 1.126 km from a main-belt table in both JPL's database and the literature cards, and 'should be dropped'. tools/method_missions.py, method/v0_1/derivation/missions.txt: that size implies a reflectivity of 0.0012; the next lowest among list members is 0.013, so 0.005 removes it and nothing else"

[rules.conflict]
# Sources that disagree across a threshold.
spin = "When periods in use fall on both sides of a spin gate's threshold, by value or by stated range, no period decides: the gate is untested with the prior for its brightness, and its text says the sources disagree."
kind = "judgement"
source = "2013 NJ: 250 h in Pravec's table (U 3) and the lightcurve database, 2.02 h on its literature card (U 2). The only such row on 2026-11-25"

[rules.gone]
text = "A body ledger.toml lists as gone fails every mission: its orbit gate fails with the reason, and no observation is ranked."
kind = "quoted"
source = "ledger.toml [[gone]]"

[rules.unchecked]
text = "When a source for a gate's row was not checked, the gate's text says not checked, never not measured. The gate is untested with its prior."
no_h = "An object with no H has no size, mass or spin prior: those gates are untested with no p, and so is the mission."
kind = "quoted"
source = "AGENTS.md, traps; docs/mvp.md section 4, Row"

[rules.mass]
# The mass gate has no direct measurement for any list member but the three sampled asteroids.
decides = "pass when the upper end of a measured size at 7,500 kg/m3 is under the ceiling; fail when its lower end at 900 kg/m3 is over it"
otherwise = "untested, with p from the joint draws of density given class and reflectivity"
density_on_file = "A bulk density on file (JPL's for the three sampled asteroids; a literature card's from radiation pressure or drift) replaces the class range in the draws, so it narrows the mass range and p. It does not decide the gate: 12 of the 15 on file come from a model of the push, not from a measured mass"
kind = "judgement"
source = "7,500 and 900 kg/m3 are the two ends of priors.toml [density]"

# ----------------------------------------------------------------------------------------------------------------
[surface]
label = "Surface work"
summary = "Land on or anchor to a body tens of metres or more across and work loose material."
kind = "quoted"
source = "docs/plan.md section 1.4 and section 6 (proposed mission types); DESIGN.md section 9"

[[surface.gates]]
id = "findable"
label = "Orbit code 5 or better"
quantity = "occ"
unit = "orbit condition code, 0 best to 9 worst"
op = "<="
preset = 5
range = [2, 5]
label_note = "The label names the test. Code 5 or better is the line docs/plan.md uses for 'an orbit good enough to find again', but JPL flags the next window of 137 list members that pass it as survey-recovery-only (130 at code 5, 7 at code 4), so the gate does not claim findability; its text says when JPL finds the position too uncertain to point at. Whether such an object should pass is Adam's call."
kind = "judgement"
source = "docs/plan.md section 1.4 counts 'orbit good enough to find again' with code 5 or better (data/research/scripts/rv_users_sieve2.py). docs/research/verify-obs-window.md section 1: no object with code 0-3 is flagged survey-recovery-only, 2,339 of 2,655 windowed objects with code 6-9 are; code 5 or better and JPL's own pointing test give the same count under 6 km/s but not the same objects. docs/research/industry.md 'Which properties matter', item 1: codes 0-2 are 13.6% of the list, 6 or worse 69.8%"
alternatives = [
  { value = 2, what = "the strict cut in docs/research/industry.md item 1" },
  { value = 3, what = "the worst code JPL never flags survey-recovery-only (docs/research/verify-obs-window.md section 1)" },
  { value = 5, what = "the cut used for the counts in docs/plan.md section 1.4" },
]

[[surface.gates]]
id = "size"
label = "30 m or wider"
quantity = "diameter_m"
unit = "m"
op = ">="
preset = 30.0
range = [18.0, 100.0]
kind = "judgement"
source = "docs/research/industry.md, ASIME 2018: Patrick Michel, '30m size is borderline.. asteroid could be a really fast spinner'; docs/research/capability.md section 7.2 puts its class boundary at 30 m. No source states a minimum size for working a surface; the others below are economic minimums or a preference"
alternatives = [
  { value = 18.0, what = "Elvis 2014, smallest water ore body (docs/research/industry.md, quantitative literature table)" },
  { value = 30.0, what = "Michel, ASIME 2018: 'borderline' (docs/research/industry.md)" },
  { value = 40.0, what = "the H 24 line of the sketch in docs/plan.md section 1.4" },
  { value = 100.0, what = "Elvis 2014, smallest platinum-group ore body (docs/research/industry.md)" },
]
not_used = "Karman+ wanted a rubble pile 'with a diameter measured in hundreds of meters' (docs/research/industry.md item 3). It is a preference; two of the five targets the company has named are fainter than H 22.5."

[[surface.gates]]
id = "spin"
label = "Turns once in 2.2 h or slower"
quantity = "period_h"
unit = "h"
op = ">="
preset = 2.2
range = [1.0, 3.0]
formula = "P_crit = sqrt(3 * pi / (G * density)): the period at which gravity and the outward pull balance at the equator of a sphere with no cohesion"
density_kgm3 = 2250
gravitational_constant = 6.6743e-11
kind = "judgement"
source = "docs/research/capability.md section 2: 2.3 h at 2,000 kg/m3, 3.0 h at 1,200, 1.2 h for solid iron. docs/research/industry.md item 4: Karman+ 'uses the 2.2 h spin barrier'. 2.2 h is the formula at 2,250 kg/m3; it is chosen because every count in docs/plan.md section 1.2 and every spin prior in priors.toml is stated at 2.2 h"
alternatives = [
  { value = 1.0, what = "period over 1 h: Alarcon et al. 2026 for surface work, Thirouin et al. 2016 for a viable target (docs/research/industry.md item 4; docs/research/verify-coverage.md section 2.3)" },
  { value = 2.2, what = "2,250 kg/m3; the spin barrier Karman+ uses" },
  { value = 2.3, what = "2,000 kg/m3, the density Karman+'s Prospector assumes for every body (docs/research/verify-facts-missions.md)" },
  { value = 3.0, what = "1,200 kg/m3, a body like Bennu or Ryugu (docs/research/capability.md section 2)" },
]
caveat = "A screening line, not a physical limit: slight cohesion lets a small body turn faster and keep its surface (docs/plan.md section 1.2). As of 21 November 2026 we found no spacecraft that has touched an asteroid turning faster than once in about 4 h (docs/research/capability.md section 2)."

[surface.not_gated]
delta_v = "Reach is a filter the visitor sets, not a gate. JPL's figure is the cheapest round trip over all launch dates, and first missions choose by launch date (docs/research/industry.md item 2)."
tumbling = "Karman+ ranks 'slow rotation, and not tumbling' (docs/research/industry.md item 4). The lightcurve database flags tumblers, Apophis among them, and Apophis is the company's first target. No source gives a line for how much tumbling rules a body out."
class = "No class is required: the first missions filter loosely on class and choose by launch date (docs/plan.md section 1.3)."
kind = "quoted"
source = "as given in each entry"

