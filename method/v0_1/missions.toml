[surface.check]
kind = "measured"
source = "tools/method_missions.py, method/v0_1/derivation/missions.txt: the pipeline's records for these objects, from the snapshot of 24 November 2026 and the research snapshot of literature cards"
known_pass = 2
untested = 3
known_fail = 0

[[surface.named]]
designation = "2008 EV5"
pdes = "341843"
named_by = "Karman+, reference target, 2023 payload call (docs/research/industry.md section d); NASA's cancelled boulder mission (docs/research/capability.md section 4.3)"
status = "pass"
p = 1.0
gates = { findable = "pass", size = "pass", spin = "pass" }
kind = "measured"
source = "tools/method_missions.py, method/v0_1/derivation/missions.txt"
why = "Orbit code 0. 344 m (338 to 350, one sigma; literature card, MacLennan et al. 2022). 3.72 h, graded U 2 (Pravec's table)."

[[surface.named]]
designation = "2011 AA37"
pdes = "2011 AA37"
named_by = "Karman+, reference target, 2023 payload call (docs/research/industry.md section d)"
status = "untested"
p = 0.3485
gates = { findable = "pass", size = "untested", spin = "untested" }
kind = "measured"
source = "tools/method_missions.py, method/v0_1/derivation/missions.txt"
why = "Not a known pass. Its only period, 10 h, is graded unreliable (Pravec's table: U column 1, remark 'U = 1+ or 2-'), so the spin gate falls back to the prior for H 22.9: 0.35 that it turns once in 2.2 h or slower. No size is measured; from brightness it is 41–149 m (5th-95th), 30 m or wider in 0.997 of draws. Orbit code 0."

[[surface.named]]
designation = "2022 DC5"
pdes = "895813"
named_by = "Karman+, primary target of its first mission as of the 2025 abstract (docs/research/novelty.md section 3)"
status = "untested"
p = 0.9975
gates = { findable = "pass", size = "untested", spin = "pass" }
kind = "measured"
source = "tools/method_missions.py, method/v0_1/derivation/missions.txt"
why = "Not a known pass only because no size is measured: at H 22.93 and a class S from colours, a label taken as wrong in 21 of 100 draws, it is 42–163 m (5th-95th), 30 m or wider in 0.9975 of draws. Orbit code 1. 9.675 h, graded U 3 (Pravec's table). It needs 7.24 km/s, which is a filter here, not a gate."

[[surface.named]]
designation = "2021 UH2"
pdes = "2021 UH2"
named_by = "Karman+, backup target of its first mission as of the 2025 abstract (docs/research/novelty.md section 3)"
status = "untested"
p = 0.3235
gates = { findable = "pass", size = "untested", spin = "pass" }
kind = "measured"
source = "tools/method_missions.py, method/v0_1/derivation/missions.txt"
why = "A probable miss on size. No size is measured; at H 25.08 it is 14–57 m (5th-95th), 30 m or wider in 0.32 of draws (0.82 at the 18 m end of the range). Karman+ chose it on brightness as a stand-in for size, on reach and on rotation period. Orbit code 1. 3.8 h, graded U 2- (Pravec's table, from its remark)."

[[surface.named]]
designation = "Apophis"
pdes = "99942"
named_by = "Karman+, target of its first mission since 21 July 2026 (docs/research/industry.md section d)"
status = "pass"
p = 1.0
gates = { findable = "pass", size = "pass", spin = "pass" }
kind = "measured"
source = "tools/method_missions.py, method/v0_1/derivation/missions.txt"
why = "Orbit code 0. 340 m (300 to 380, one sigma; literature card, Brozović et al. 2018): 260 m at two sigma. 30.56 h (JPL). The lightcurve database flags it a tumbler, which is not gated."

# ----------------------------------------------------------------------------------------------------------------
[capture]
label = "Whole-body capture"
summary = "Enclose an asteroid a few metres across and move all of it."
kind = "quoted"
source = "docs/plan.md section 1.4 (last paragraph) and section 6; docs/research/capability.md section 4.3"

[[capture.gates]]
id = "findable"
label = "Orbit code 5 or better"
quantity = "occ"
unit = "orbit condition code, 0 best to 9 worst"
op = "<="
preset = 5
range = [2, 5]
kind = "judgement"
source = "as for surface work. The Keck study on what is known beforehand: 'only a few dozen of these are currently known. Fewer still have secure orbits' (docs/research/capability.md section 4.3)"

[[capture.gates]]
id = "size"
label = "10 m or smaller"
quantity = "diameter_m"
unit = "m"
op = "<="
preset = 10.0
range = [7.0, 10.0]
kind = "judgement"
source = "docs/research/capability.md section 7.2: 'whole-body capture, under about 10 m'; section 3: TransAstra's capture bag is 10 m, inflated and closed on the ground in November 2026. docs/research/nongrav.md section 5: NASA's Asteroid Redirect Mission 'needed a target of about 7-10 m and about 500 t'. The Keck study (Brophy et al. 2012) designed for 'roughly 7 m' with a bag for a body 6 m by 12 m (saved copy, data/research/dl/keck.txt lines 134 and 1046-1047)"
alternatives = [
  { value = 7.0, what = "Keck study nominal: a 7 m, 500 t asteroid (docs/research/capability.md section 4.3)" },
  { value = 10.0, what = "TransAstra's bag; capability.md section 7.2" },
]

[[capture.gates]]
id = "mass"
label = "1,300 t or lighter"
quantity = "mass_t"
unit = "t"
op = "<="
preset = 1300.0
range = [100.0, 1300.0]
kind = "judgement"
source = "docs/research/capability.md section 4.3 and docs/research/verify-capability.md row 52: 'the Keck capture hardware was sized for 250 to 1,300 t'. It is the top of that one design's range, not a limit: the same report lists trajectories for 1,800 and 3,600 t, and only this one capture study was read"
alternatives = [
  { value = 100.0, what = "TransAstra: about 100 t; Karman+ 'Roc': whole asteroids up to 100,000 kg (docs/research/capability.md section 3)" },
  { value = 500.0, what = "Keck study nominal (docs/research/capability.md section 4.3)" },
  { value = 1000.0, what = "Keck study: 'could retrieve NEAs with masses up to about 1,000,000 kg' (saved copy, data/research/dl/keck.txt line 1063)" },
  { value = 1300.0, what = "Keck study, top of the range its hardware was sized for" },
]

[capture.not_gated]
spin = "No spin gate (docs/plan.md Appendix C, WP2). TransAstra's bag 'is designed to tolerate tumbling' (docs/research/industry.md section d). The Keck design set an upper limit of one turn a minute and sized its de-spin for 1,100 t at that rate (docs/research/capability.md section 4.3; saved copy, data/research/dl/keck.txt lines 986-987). priors.toml has no figure for periods under a minute, so that limit is recorded here and not applied. As of 21 November 2026 we found nothing that has enclosed a tumbling rock."
delta_v = "Reach is a filter the visitor sets, not a gate. The Keck case needed 0.17 km/s to come back, on an object whose orbit returns it to Earth (docs/research/capability.md section 4.2)."
class = "No class is required. The Keck study wanted a C-type and noted that none of the known candidates had a spectral type (docs/research/capability.md section 4.3)."
kind = "quoted"
source = "as given in each entry"

# Check of the presets against the targets named for whole-body capture: two candidates for NASA's Asteroid
# Redirect Mission, both observed with Spitzer (docs/research/summaries-review.md, reviewer 3;
# docs/research/nongrav.md section 5; docs/research/verify-obs-window.md section 3, thermal infrared row).
[capture.check]
kind = "measured"
source = "tools/method_missions.py, method/v0_1/derivation/missions.txt: the pipeline's records for these objects"
known_pass = 1
untested = 1
known_fail = 0

[[capture.named]]
designation = "2009 BD"
pdes = "2009 BD"
named_by = "candidate target of NASA's Asteroid Redirect Mission, which needed about 7-10 m and about 500 t (Mommert et al. 2014; docs/research/nongrav.md section 5)"
status = "pass"
p = 1.0
gates = { findable = "pass", size = "pass", mass = "pass" }
kind = "measured"
source = "tools/method_missions.py, method/v0_1/derivation/missions.txt"
why = "Orbit code 1. 4 ± 1 m from a thermal model (Mommert et al. 2014, literature card); the paper's other solution, 2.9 m, also passes. At 6 m, two sigma above, and 7,500 kg/m³ it is 850 t, under the ceiling whatever it is made of. At the 100 t end of the range it would be untested, 0.64."

[[capture.named]]
designation = "2011 MD"
pdes = "2011 MD"
named_by = "candidate target of NASA's Asteroid Redirect Mission, which needed about 7-10 m and about 500 t (Mommert et al. 2014; docs/research/nongrav.md section 5)"
status = "untested"
p = 0.9995
gates = { findable = "pass", size = "pass", mass = "untested" }
kind = "measured"
source = "tools/method_missions.py, method/v0_1/derivation/missions.txt"
why = "Not a known pass only because its mass is not measured: 6 ± 2 m (Mommert et al. 2014, literature card) is 10 m at two sigma, which at solid-iron density would be 3,900 t. With the density on its literature card, about 750 kg/m³ from radiation pressure and a 2.2-sigma thermal detection, it is 4.6–380 t (5th-95th), under 1,300 t in every draw; a chance is never recorded as 1, so 0.9995. The density narrows the draws and decides no gate. Orbit code 2."
