[class]
# Shares at a given brightness, not a given size.
ids = ["S", "C", "X", "other"]
members = { S = "S, Q", C = "C, B, F, G", X = "X, E, M, P", other = "A, D, K, L, O, R, T, V, Z" }
kind = "quoted"
source = "the grouping of docs/research/verify-prior-null.md section 1"

[class.label_error]
# A measured class is a label, and labels are wrong at a known rate. In the joint draw this share of an object's
# draws take a class from the other side of S/Q against the rest: S when the label is C, X or other; else C, X
# or other by their weights. An asteroid a spacecraft brought a sample back from has no label error.
colour = 0.210
colour_kind = "quoted"
colour_source = "docs/research/verify-prior-null.md, 'Label noise': colour-based classes (Sergeyev) disagree with spectral classes (Mahlke) for 21% of 874 shared objects on S/Q versus rest"
spectrum = 0.125
spectrum_kind = "quoted"
spectrum_source = "docs/research/verify-value-inputs.md section 4, objection 2: sources disagree on the class of at least 3 of the 24 classified objects under 6 km/s (docs/plan.md section 1.2); 3 of 24 is 12.5%. It counts any change of class, not only S/Q against the rest, and it is 'at least'. No other figure for labels from spectra was found"
colour_means = "a class from broad-band colours: SsODNet technique 'Phot'"
spectrum_means = "any other class label: a spectrum, or JPL's Tholen and SMASSII classes"
kind = "quoted"
source = "as given for each rate"

