# longshot method 0.1: priors for size, spin, class and density from brightness.
#
# A PROPOSAL until Adam freezes it. After that no number here changes; a change is a new method version.
# Written by tools/method_priors_toml.py. Do not edit a number by hand: change the script and rerun it.
# docs/method.md explains each section.
#
# Every table carries `kind` and `source` for the constants in it. Where constants in one table differ in
# origin, each has its own `<name>_kind` and `<name>_source`, or a `<name>_from` naming the estimate.
#   measured  = measured from data on disk by a script in tools/; its printed output is under
#               method/v0_1/derivation/
#   quoted    = quoted from a file under docs/research, which names the published source
#   judgement = a choice made here, with the range it was chosen from

schema = 1
method = "0.1"
status = "proposal"
data_date = "2026-11-24"
generated_by = "tools/method_priors_toml.py"

[bands]
# Brightness bands by absolute magnitude H. Band i holds edges[i-1] <= H < edges[i].
ids = ["under_20", "20_22", "22_24", "24_26", "26_28", "28_up"]
edges = [20.0, 22.0, 24.0, 26.0, 28.0]
kind = "judgement"
source = "the two-magnitude bins of docs/research/verify-coverage.md section 2.2, with everything brighter than H 20 in one band"

[size]
formula = "D[m] = coefficient_m * 10^(-H/5) / sqrt(pv)"
coefficient_m = 1.329e6
kind = "quoted"
source = "the standard relation, D = 1,329 km * 10^(-H/5) / sqrt(reflectivity): docs/research/value-inputs.md section 5.2, row Size from H"
# Below this brightness the reflectivity table is extrapolation.
extrapolated_fainter_than_h = 25.0
n_measured_at_or_fainter = 3
faintest_measured_h = 25.7
extrapolation_kind = "measured"
extrapolation_source = "tools/method_reflectivity.py, method/v0_1/derivation/reflectivity.txt: 3 of 1576 Spitzer objects (a < 2 au) have H of 25 or more, 15 have H of 24 or more, median H 19.5. docs/plan.md section 7 states the same limit"
# An object with no H gets no size prior.
n_list_members_without_h = 6

[h_uncertainty]
# H is drawn as normal(H, sigma) before the size formula. sigma is JPL's H_sigma where JPL gives one, else default_sigma.
use = "SBDB H_sigma"
default_sigma = 0.36
kind = "measured"
source = "tools/method_reflectivity.py, method/v0_1/derivation/reflectivity.txt: median H_sigma of the 4970 of 7231 list members that have one (10th-90th percentile 0.25-0.52). Consistent with 0.3-0.5 mag in docs/research/nongrav.md section 2.4 and 0.4 in docs/research/value-inputs.md section 5.2"
note = "The Spitzer spread already holds the H error of its own, brighter targets, so adding H_sigma counts some of it twice: the 5%-95% size range goes from a factor of 3.4 to 3.7 at the default. It errs wide."

[reflectivity]
# Quantiles of the geometric albedo measured by Spitzer for near-Earth asteroids with a < 2 au, one value per object.
# Sample by inverse transform: u uniform on (0,1), clamped to [p[0], p[-1]]; interpolate log10(pv) linearly in p.
# The table says nothing about the tails beyond its end points; a draw there takes the end value.
p = [0.025, 0.050, 0.100, 0.150, 0.200, 0.250, 0.300, 0.350, 0.400, 0.450, 0.500, 0.550, 0.600, 0.650, 0.700, 0.750, 0.800, 0.850, 0.900, 0.950, 0.975]
pv = [0.0320, 0.0575, 0.0990, 0.1303, 0.1600, 0.1820, 0.2020, 0.2192, 0.2350, 0.2548, 0.2725, 0.2910, 0.3100, 0.3280, 0.3460, 0.3750, 0.4050, 0.4517, 0.5200, 0.6653, 0.7972]
n_objects = 1576
n_rows = 1630
n_fitted_above_1 = 17
interpolate = "log10(pv) linear in p"
kind = "measured"
source = "tools/method_reflectivity.py, method/v0_1/derivation/reflectivity.txt, from data/research/dl/coverage-exact/spitzer/spitzerneos.csv (Trilling et al. 2010, AJ 140, 770; 2016, AJ 152, 172). Why Spitzer and not NEOWISE: docs/research/verify-prior-null.md Trap 2 and section 3.5"
note = "The spread includes Spitzer's own measurement error and the error in H at the time. It is the spread of measured size at a given catalogued H, which is what the size check in docs/plan.md Appendix A tests."

[reflectivity.by_class.S]
# Same probabilities as [reflectivity].p. Used when the class is measured and the reflectivity is not.
# Sampled the same way. Values are kept as fitted, noise included: a knot under 0.03 or over 1 is a noisy fit.
n = 286
pv = [0.1120, 0.1325, 0.1575, 0.1735, 0.1967, 0.2140, 0.2225, 0.2397, 0.2540, 0.2692, 0.2875, 0.2960, 0.3100, 0.3232, 0.3335, 0.3538, 0.3799, 0.4042, 0.4425, 0.5005, 0.6126]
