source = "tools/method_reflectivity.py, method/v0_1/derivation/reflectivity.txt section (b): Spitzer objects (a < 2 au) whose class in data/research/out-prior-null/labels.csv comes from a spectrum (Mahlke 2022, Marsset 2022, Perna 2016, JPL)"

