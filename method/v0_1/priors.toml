[density]
# Bulk density by class, for turning a size into a mass. Drawn flat between lo and hi.
unit = "kg/m3"
shape = "uniform"
kind = "quoted"
source = "docs/research/value-inputs.md section 4 ('flat within the range'). The ranges are that report's judgement from Carry 2012 and the direct densities in docs/research/ground-truth.md section 7.1; none of those bodies is under about 150 m"
spin_does_not_change_density = true
spin_does_not_change_density_kind = "quoted"
spin_does_not_change_density_source = "docs/research/verify-value-inputs.md section 2.6: the rule that a fast spin implies a denser body is refuted (2011 MD, 1.1 g/cm3, turns in about 12 minutes)"

[density.S]
lo = 1700
hi = 3400
kind = "quoted"
source = "docs/research/value-inputs.md section 4, 'Recommended ranges for 5-30 m bodies', row Stony (S, Q): rubble like Itokawa or Dimorphos to a single block at meteorite density. Direct densities behind it: docs/research/ground-truth.md section 7.1"

[density.C]
lo = 900
hi = 2300
kind = "quoted"
source = "docs/research/value-inputs.md section 4, row Dark (C, B, D, P): Bennu, Ryugu and lighter to a single block of CM"

[density.other]
lo = 1200
hi = 3300
kind = "judgement"
source = "docs/research/value-inputs.md section 4, row Unknown class (5th-95th, median 2,300). The research gives no row for A, D, K, L, O, R, T, V, Z as a group; this takes its widest non-metal row"

[density.X]
# An X-class draw takes its density from its drawn reflectivity (Tholen's split of the X complex).
split_edges_pv = [0.10, 0.30]
metal_rich_share_of_mid = 0.38
metal_rich_share_range = [0.10, 0.60]
kind = "quoted"
source = "split: docs/research/value-inputs.md section 1.4 (E above 0.3, M 0.1-0.3, P below 0.1). 0.38: Shepard et al. 2015, 11 of 29 main-belt M-class asteroids metal-dominated by radar, same section. Range 0.10-0.60: docs/research/verify-value-inputs.md section 1 item 3, which calls 0.38 a placeholder"

[density.X.dark]
when = "pv < 0.10 (Tholen P)"
lo = 900
hi = 2300
kind = "quoted"
