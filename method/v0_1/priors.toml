[reflectivity.link]
# Ties class to reflectivity in the joint draw. `all` is the share of all Spitzer objects in each reflectivity bin;
# S, C, X, other are P(bin | class) from the counts below. Bin i holds edges[i-1] <= pv < edges[i].
edges = [0.10, 0.20, 0.30, 0.45]
all = [0.1009, 0.1948, 0.2798, 0.2722, 0.1523]
S = [0.0175, 0.1923, 0.3601, 0.3357, 0.0944]
C = [0.6000, 0.0571, 0.0857, 0.0857, 0.1714]
X = [0.3684, 0.2105, 0.0789, 0.1316, 0.2105]
other = [0.0577, 0.2115, 0.1538, 0.2885, 0.2885]
counts = { S = [5, 55, 103, 96, 27], C = [21, 2, 3, 3, 6], X = [14, 8, 3, 5, 8], other = [3, 11, 8, 15, 15] }
kind = "measured"
source = "tools/method_class.py, method/v0_1/derivation/class.txt section LINK: the same spectrally classed Spitzer objects as [reflectivity.by_class]"
edges_kind = "judgement"
edges_source = "0.10 and 0.30 are Tholen's P/M/E limits (docs/research/value-inputs.md section 1.4); 0.20 and 0.45 split the two crowded bins"
note = "Literature cards with a measured (not computed) reflectivity and a class give 4 objects (S 2, C 2, X 0, other 0), too few to use; see the derivation, section (a). Mahlke 2022 uses reflectivity as an input to its classes, so this table is partly circular."

[spin]
# Chance that the rotation period is under each threshold, for an object with no measured period, by H band.
# central is used in draws. low and high are the spread between denominators, not a confidence interval.
# A draw gives a category only (under 10 min; 10 min to 1 h; 1 h to 2.2 h; 2.2 h or slower), never a period.
ids = ["under_2_2h", "under_1h", "under_10min"]
thresholds_h = [2.2, 1.0, 0.16666667]
kind = "quoted"
source = "2.2 h, 1 h and 10 min are the thresholds of docs/plan.md Appendix A (channel Spin from H) and docs/research/verify-coverage.md section 2"
independent_of = "size, reflectivity and class at a given H (an assumption; untested)"
independent_of_kind = "judgement"

