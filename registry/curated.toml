# Hand-entered measurements that no database on disk holds. Source id "curated", licence class "single":
# each value is shown on the asteroid's own page with its citation, and never in a bulk file.
#
# Enter only a value that a file under docs/research records as checked at its primary source. Each claim
# carries the citation, and the research file and passage where it was verified. verified_passage is quoted
# word for word from verified_in, and a test checks that it is there. longshot/ingest/curated.py
# reads this file and stops the build on anything it does not understand.
#
# prop: diameter_m (unit m or km), period_h (unit h, min or s), albedo (no unit), taxonomy (a class label).
# value and error are in `unit`, as the paper prints them. error is one sigma; leave it out when none is stated.
# quality: how it was measured, in a few words. For a class, start with "Spec" (a spectrum) or "Phot" (colours).

schema = 1
edition = "2026-11-25"          # the day this file was last changed

[[claim]]
designation = "2022 OB5"
prop = "period_h"
value = 1.542
error = 0.001
unit = "min"
quality = "lightcurve, 10.4 m GTC, five bands"
citation = "Alarcon et al. 2026, Icarus 117153, arXiv:2605.04784"
verified_in = "docs/research/verify-facts-missions.md"
verified_passage = "Measured: rotation period 1.542 +/- 0.001 min from five-band HiPERCAM photometry on the 10.4-m GTC, confirmed at 1.544 +/- 0.007 min with the Two-meter Twin Telescope on 2026-01-14."
also_in = "docs/research/verify-nongrav.md, table row 4a: '1.542 min, X-complex', Confirmed"

[[claim]]
designation = "2022 OB5"
prop = "taxonomy"
value = "X"
quality = "Phot five bands, X-complex, best match Xc"
citation = "Alarcon et al. 2026, Icarus 117153, arXiv:2605.04784"
verified_in = "docs/research/verify-facts-missions.md"
verified_passage = "Class: featureless, moderately red, X-complex; best match Xc, next Xk."
also_in = "docs/research/verify-nongrav.md, table row 4a: '1.542 min, X-complex', Confirmed"

